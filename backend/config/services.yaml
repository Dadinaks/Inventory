# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Dadinaks\:
        resource: "../src/"

    Dadinaks\Shared\Adapter\Presenter\JsonPresenter:
        public: true

    Dadinaks\Shared\Infrastructure\Api\EventListener\ApiExceptionListener:
        arguments:
            $presenter: '@Dadinaks\Shared\Adapter\Presenter\JsonPresenter'
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # Tous les services sous Dadinaks\Product\
    Dadinaks\Product\:
        resource: "../src/Product/*"
        exclude: "../src/Product/{Domain,Tests}"
        bind:
            Dadinaks\Shared\Domain\Repository\RepositoryInterface: '@Dadinaks\Product\Infrastructure\Persistence\Doctrine\Repository\ProductReposity'

    # Tous les services sous Dadinaks\Role\
    Dadinaks\Role\:
        resource: "../src/Role/*"
        exclude: "../src/Role/{Domain,Tests}"
        bind:
            Dadinaks\Shared\Domain\Repository\RepositoryInterface: '@Dadinaks\Role\Infrastructure\Persistence\Doctrine\Repository\RoleRepository'

    # Tous les services sous Dadinaks\User\
    Dadinaks\User\:
        resource: "../src/User/*"
        exclude: "../src/User/{Domain,Tests}"
        bind:
            Dadinaks\Shared\Domain\Repository\RepositoryInterface: '@Dadinaks\User\Infrastructure\Persistence\Doctrine\Repository\UserRepository'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Dadinaks\User\Infrastructure\Security\EventListener\JWTInvalidationListener:
        tags:
            - {
                  name: "kernel.event_listener",
                  event: "lexik_jwt_authentication.on_jwt_decoded",
                  method: "onJWTDecoded",
              }
              
    Dadinaks\User\Infrastructure\Security\EventListener\JWTResponseListener:
        tags:
            - {
                  name: "kernel.event_listener",
                  event: "lexik_jwt_authentication.on_jwt_invalid",
                  method: "formatInvalidTokenResponse",
              }
            - {
                  name: "kernel.event_listener",
                  event: "lexik_jwt_authentication.on_authentication_failure",
                  method: "formatFailureResponse",
              }
